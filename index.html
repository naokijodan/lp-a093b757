<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>出品提案</title>
<style>
:root{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#1B2330; --muted:#5A6474;
  --line:#E2E6EB; --accent:#D7263D; --indigo:#2B4C8C; --amber:#B26E0A;
  --green:#2E7D5B; --purple:#7B4FA6; --tint:#EDF0F4;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#12161E; --surface:#1A202B; --ink:#E8EBF0; --muted:#98A2B3;
    --line:#2A3140; --accent:#F0455C; --indigo:#8CA9E0; --amber:#E0A44B;
    --green:#5CB48E; --purple:#B08BD8; --tint:#232A37;
  }
}
:root[data-theme="dark"]{
  --bg:#12161E; --surface:#1A202B; --ink:#E8EBF0; --muted:#98A2B3;
  --line:#2A3140; --accent:#F0455C; --indigo:#8CA9E0; --amber:#E0A44B;
  --green:#5CB48E; --purple:#B08BD8; --tint:#232A37;
}
:root[data-theme="light"]{
  --bg:#F3F5F7; --surface:#FFFFFF; --ink:#1B2330; --muted:#5A6474;
  --line:#E2E6EB; --accent:#D7263D; --indigo:#2B4C8C; --amber:#B26E0A;
  --green:#2E7D5B; --purple:#7B4FA6; --tint:#EDF0F4;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic",Meiryo,sans-serif;
  font-size:14px; line-height:1.55; -webkit-font-smoothing:antialiased;
}
a{color:inherit; text-decoration:none}
.num{font-variant-numeric:tabular-nums}
.mast{background:var(--surface); border-bottom:1px solid var(--line)}
.mast-in{max-width:1280px; margin:0 auto; padding:14px 16px;
  display:flex; flex-wrap:wrap; align-items:baseline; gap:8px 16px}
.brand{font-size:22px; font-weight:800; letter-spacing:.02em}
.brand b{color:var(--accent)}
.today{color:var(--muted); font-size:12.5px}
.count{margin-left:auto; font-size:12.5px; color:var(--muted)}
.count b{color:var(--ink); font-size:15px}
.wrap{max-width:1280px; margin:0 auto; padding:16px 16px 60px}

.viewtabs{display:flex; gap:8px; margin-bottom:14px}
.viewtabs button{appearance:none; font-family:inherit; cursor:pointer; font-size:14px;
  font-weight:800; padding:8px 18px; border-radius:999px; border:1px solid var(--line);
  background:var(--surface); color:var(--ink)}
.viewtabs button.on{background:var(--ink); color:var(--bg); border-color:var(--ink)}
.viewtabs button .n{color:var(--muted); font-weight:600; margin-left:4px}
.viewtabs button.on .n{color:var(--bg); opacity:.75}

.filterbar{background:var(--surface); border:1px solid var(--line); border-radius:8px;
  padding:12px 14px; margin-bottom:14px; display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center}
.filterbar input[type=text]{font-family:inherit; font-size:13px; padding:7px 10px;
  border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--ink);
  min-width:220px; flex:1 1 220px}
.filterbar label.grp{font-size:12px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:6px}
.chiprow{display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.chipbtn{appearance:none; font-family:inherit; cursor:pointer; font-size:12px; font-weight:700;
  padding:4px 11px; border-radius:999px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
.chipbtn.on{background:var(--indigo); color:#fff; border-color:var(--indigo)}
.fb-reset{appearance:none; font-family:inherit; cursor:pointer; font-size:12px; font-weight:700;
  padding:5px 12px; border-radius:999px; border:1px solid var(--accent); background:var(--surface); color:var(--accent)}
.fb-reset:hover{background:var(--accent); color:#fff}
.fb-summary{font-size:12px; color:var(--muted); width:100%}
.fb-summary b{color:var(--ink)}
.togglewrap{font-size:12px; color:var(--muted); font-weight:700; display:flex; align-items:center; gap:6px}

.note-box{font-size:12px; color:var(--muted); background:var(--tint); border:1px solid var(--line);
  border-radius:8px; padding:10px 12px; margin-bottom:14px}
.note-box b{color:var(--ink)}
.warn-box{font-size:12px; color:#fff; background:var(--accent); border-radius:8px;
  padding:10px 12px; margin-bottom:14px}

.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:14px}
.card{background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden;
  display:flex; flex-direction:column; transition:transform .12s ease, box-shadow .12s ease}
@media(prefers-reduced-motion:no-preference){
  .card:hover{transform:translateY(-2px); box-shadow:0 6px 18px rgba(0,0,0,.10)}
}
.card.adopted{outline:2px solid var(--green)}
.card .head{padding:10px 12px 0; display:flex; gap:6px; align-items:flex-start; flex-wrap:wrap}
.card .body{padding:8px 12px 12px; display:flex; flex-direction:column; gap:6px; flex:1}
.card .t{font-size:14px; font-weight:800; line-height:1.4}
.card .sub{font-size:11.5px; color:var(--muted)}
.card .reason{font-size:12.5px; color:var(--ink); background:var(--tint); border-radius:6px; padding:7px 9px}
.card .metrics{font-size:11.5px; color:var(--muted); border-top:1px solid var(--line); padding-top:6px}
.card .metrics b{color:var(--ink)}
.card .dt{font-size:11.5px; color:var(--muted)}
.card .links{display:flex; flex-wrap:wrap; gap:6px; margin-top:2px}
.card .links a{font-size:11.5px; font-weight:700; color:#fff; background:var(--indigo);
  border-radius:5px; padding:4px 9px; display:inline-block}
.card .links a:hover{opacity:.85}
.card .links a.mercari{background:var(--amber)}
.card .adoptrow{display:flex; align-items:center; gap:8px; border-top:1px solid var(--line);
  padding-top:8px; margin-top:2px; font-size:12px; font-weight:700}
.card .adoptrow input[type=checkbox]{width:16px; height:16px}
.card .memorow{display:flex; gap:6px}
.card .memorow input[type=text]{flex:1; font-family:inherit; font-size:12px; padding:5px 8px;
  border-radius:5px; border:1px solid var(--line); background:var(--surface); color:var(--ink)}
.card .memorow button{appearance:none; font-family:inherit; cursor:pointer; font-size:11.5px; font-weight:700;
  padding:5px 10px; border-radius:5px; border:1px solid var(--indigo); background:var(--surface); color:var(--indigo)}
.card .savedmsg{font-size:11px; color:var(--green); min-height:14px}

.chip{display:inline-block; padding:2px 8px; border-radius:3px; font-size:11px;
  font-weight:800; line-height:1.7; white-space:nowrap}
.chip.conf-A{color:#fff; background:var(--accent)}
.chip.conf-B{color:#fff; background:var(--indigo)}
.chip.conf-C{color:var(--muted); border:1px solid var(--line); background:var(--surface)}
.chip.act-補充{color:#fff; background:var(--indigo)}
.chip.act-攻め{color:#fff; background:var(--accent)}
.chip.act-様子見{color:var(--muted); border:1px solid var(--line); background:var(--surface)}
.chip.act-縮小{color:#fff; background:#6B7280}
.empty{padding:40px 16px; text-align:center; color:var(--muted)}
footer{max-width:1280px; margin:20px auto 0; padding:0 16px; color:var(--muted); font-size:11.5px}
@media(max-width:560px){
  .filterbar input[type=text]{min-width:0; width:100%}
  .count{margin-left:0; width:100%}
}
</style>
</head>
<body>
<header class="mast">
  <div class="mast-in">
    <div class="brand"><b>出品</b>提案</div>
    <div class="today">最終更新: 2026-09-05（土）22:47 JST</div>
    <div class="count">表示中 <b id="countNum">0</b> 件</div>

</header>
<div class="wrap">
  <div class="viewtabs" id="viewtabs">

    <label class="grp">確度
      <span class="chiprow" id="confChips"></span>

    <label class="togglewrap"><input type="checkbox" id="undecidedOnly"> 未判断のみ</label>
    <button class="fb-reset" id="resetBtn" type="button">条件クリア</button>
    <div class="fb-summary" id="fbSummary"></div>
  </div>
  <div class="note-box">

    出ています）。
  </div>
  <div class="grid" id="grid"></div>
  <div class="empty" id="emptyMsg" hidden>該当するカードがありません。</div>
</div>
<footer>出品提案（自動生成ページ）。eBayの出品数・価格は台帳保存時点のBrowse APIの目安値です。</footer>

const GAS_URL = "";

const CAN_WRITE = !!GAS_URL;

function esc(s){return (s==null?"":String(s)).replace(/[&<>"]/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
function fmtNum(v){ return (v===null||v===undefined||v==="") ? "?" : Number(v).toLocaleString(); }
function fmtUsd(v){ return (v===null||v===undefined||v==="") ? "?" : "$" + Number(v).toFixed(2); }
function fmtJpy(v){ return (v===null||v===undefined||v==="") ? "?" : "\u00a5" + Math.round(Number(v)).toLocaleString(); }
function fmtPct(v){ return (v===null||v===undefined||v==="") ? "?" : (Number(v)*100).toFixed(1) + "%"; }

function daysAgoIso(n){
  const d = new Date(TODAY_ISO + "T00:00:00+09:00");
  d.setDate(d.getDate() - (n - 1));
  return d.toISOString().slice(0,10);
}

function currentDataset(){
  return currentView === "proposals" ? DATA_PROPOSALS : DATA_STRATEGY;
}

function linksHtml(it){
  const out = [];
  (it.mercari_urls||[]).forEach((u,i) => {
    const label = (it.mercari_urls.length > 1) ? `メルカリ${i+1}` : "メルカリ";
    out.push(`<a class="mercari" href="${esc(u)}" target="_blank" rel="noopener">${label}</a>`);
  });
  if(it.ebay_active_url) out.push(`<a href="${esc(it.ebay_active_url)}" target="_blank" rel="noopener">eBay出品中</a>`);
  if(it.ebay_sold_url) out.push(`<a href="${esc(it.ebay_sold_url)}" target="_blank" rel="noopener">eBay売れた実績</a>`);
  if(it.ebay_research_url) out.push(`<a href="${esc(it.ebay_research_url)}" target="_blank" rel="noopener">Seller Hubリサーチ</a>`);
  return `<div class="links">${out.join("")}</div>`;
}

function confChip(v){
  if(!v) return "";
  return `<span class="chip conf-${esc(v)}">確度${esc(v)}</span>`;
}
function actionChip(v){
  if(!v) return "";
  return `<span class="chip act-${esc(v)}">${esc(v)}</span>`;
}

function tabAttrs(view){
  return view === "proposals"
    ? {sheet: "出品提案", keyField: "key"}
    : {sheet: "本日のリサーチ", keyField: "key"};
}

function proposalCardHtml(it){
  const domKey = `${it.date}__${it.key}`;
  return `
    <div class="card ${it.adopted ? "adopted" : ""}" data-view="proposals" data-date="${esc(it.date)}" data-key="${esc(it.key)}">
      <div class="head">${confChip(it.confidence)}<span class="chip" style="background:var(--tint);color:var(--muted)">${esc(it.category||"")}</span></div>
      <div class="body">
        <div class="t">${esc(it.name)}</div>
        <div class="sub">${esc(it.maker || "メーカー不明")}${it.kind ? "｜"+esc(it.kind) : ""}${it.release_date ? "｜発売日 "+esc(it.release_date) : ""}${it.price_jpy!=null ? "｜"+fmtJpy(it.price_jpy) : ""}</div>
        ${it.reason ? `<div class="reason">${esc(it.reason)}</div>` : ""}
        <div class="metrics">
          eBay出品数 <b class="num">${fmtNum(it.ebay_total)}</b>｜JP比率 <b class="num">${fmtPct(it.jp_ratio)}</b><br>
          最安/中央値 <b class="num">${fmtUsd(it.min_usd)}</b>/<b class="num">${fmtUsd(it.median_usd)}</b>
        </div>
        <div class="dt">${esc(it.date)}</div>
        ${linksHtml(it)}
        ${adoptRowHtml(it, domKey)}
      </div>
    </div>`;
}

        ${it.reason ? `<div class="reason">${esc(it.reason)}</div>` : ""}
        <div class="metrics">
          売れ数7/30/60日 <b class="num">${fmtNum(it.sold_7)}</b>/<b class="num">${fmtNum(it.sold_30)}</b>/<b class="num">${fmtNum(it.sold_60)}</b>
          ｜在庫数 <b class="num">${fmtNum(it.stock)}</b>${coverage}<br>
          平均売値 <b class="num">${fmtUsd(it.avg_price_usd)}</b>｜eBay出品数 <b class="num">${fmtNum(it.ebay_total)}</b>｜JP比率 <b class="num">${fmtPct(it.jp_ratio)}</b>
        </div>
        <div class="dt">${esc(it.date)}</div>
        ${linksHtml(it)}
        ${adoptRowHtml(it, domKey)}
      </div>
    </div>`;
}

function adoptRowHtml(it, domKey){
  const disabled = CAN_WRITE ? "" : "disabled";
  return `
    <div class="adoptrow">
      <input type="checkbox" id="adopt_${esc(domKey)}" ${it.adopted?"checked":""} ${disabled}
        onchange="onAdoptToggle(this)">
      <label for="adopt_${esc(domKey)}">採用</label>
    </div>
    <div class="memorow">
      <input type="text" id="memo_${esc(domKey)}" value="${esc(it.memo)}" placeholder="メモ" ${disabled}>
      <button type="button" onclick="onMemoSave(this)" ${disabled}>保存</button>
    </div>
    <div class="savedmsg" id="saved_${esc(domKey)}"></div>`;
}

function findItem(view, date_, key){
  const list = view === "proposals" ? DATA_PROPOSALS : DATA_STRATEGY;
  return list.find(it => it.date === date_ && it.key === key);
}

async function postWrite(view, date_, key, adopted, memo, domKey){
  if(!CAN_WRITE) return;
  const attrs = tabAttrs(view);
  const payload = {token: WRITE_TOKEN, tab: attrs.sheet, date: date_, key: key, adopted: !!adopted, memo: memo || ""};
  const savedEl = document.getElementById("saved_" + domKey);
  try{
    // Content-Type を text/plain にして preflight(OPTIONS) を発生させない
    // （Apps Script Webアプリの標準的な回避策。doPost側でJSONとしてパースする）。
    const res = await fetch(GAS_URL, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=utf-8"},
      body: JSON.stringify(payload),
    });
    const data = await res.json();
    if(data && data.ok){
      if(savedEl){ savedEl.textContent = "保存しました"; setTimeout(()=>{ if(savedEl) savedEl.textContent=""; }, 2500); }
    } else {
      if(savedEl) savedEl.textContent = "保存に失敗しました（" + (data && data.error || "不明なエラー") + "）";
    }
  }catch(e){
    if(savedEl) savedEl.textContent = "保存に失敗しました（通信エラー）";
  }
}

function onAdoptToggle(checkbox){
  const card = checkbox.closest(".card");
  const view = card.getAttribute("data-view");
  const date_ = card.getAttribute("data-date");
  const key = card.getAttribute("data-key");
  const item = findItem(view, date_, key);
  if(item) item.adopted = checkbox.checked;
  card.classList.toggle("adopted", checkbox.checked);
  const domKey = `${date_}__${key}`;
  const memoInput = document.getElementById("memo_" + domKey);
  postWrite(view, date_, key, checkbox.checked, memoInput ? memoInput.value : (item ? item.memo : ""), domKey);
}

function onMemoSave(btn){
  const card = btn.closest(".card");
  const view = card.getAttribute("data-view");
  const date_ = card.getAttribute("data-date");
  const key = card.getAttribute("data-key");
  const domKey = `${date_}__${key}`;
  const memoInput = document.getElementById("memo_" + domKey);
  const checkbox = document.getElementById("adopt_" + domKey);
  const item = findItem(view, date_, key);
  if(item) item.memo = memoInput.value;
  postWrite(view, date_, key, checkbox ? checkbox.checked : (item ? item.adopted : false), memoInput.value, domKey);
}

function matchesFilters(it){
  if(dateRangeDays){
    const cutoff = daysAgoIso(dateRangeDays);
    if(it.date < cutoff) return false;
  }
  if(currentView === "strategy" && actionFilter.size && !actionFilter.has(it.action)) return false;
  if(confFilter.size && !confFilter.has(it.confidence)) return false;
  if(undecidedOnly && it.adopted) return false;
  if(keyword){
    const hay = currentView === "proposals"
      ? [it.name, it.maker, it.category, it.reason].join(" ")
      : [it.series, it.character, it.reason].join(" ");
    if(hay.toLowerCase().indexOf(keyword) === -1) return false;
  }
  return true;
}

function render(){
  document.getElementById("tabProposals").classList.toggle("on", currentView==="proposals");
  document.getElementById("tabStrategy").classList.toggle("on", currentView==="strategy");
  document.getElementById("nProposals").textContent = DATA_PROPOSALS.length;
  document.getElementById("nStrategy").textContent = DATA_STRATEGY.length;
  document.getElementById("actionGrp").style.display = currentView === "strategy" ? "flex" : "none";

  const filtered = currentDataset().filter(matchesFilters);
  const grid = document.getElementById("grid");
  const emptyMsg = document.getElementById("emptyMsg");
  if(filtered.length === 0){
    grid.innerHTML = "";
    emptyMsg.hidden = false;
  } else {
    emptyMsg.hidden = true;
    grid.innerHTML = filtered.map(currentView === "proposals" ? proposalCardHtml : strategyCardHtml).join("");
  }
  document.getElementById("countNum").textContent = filtered.length;
  document.getElementById("fbSummary").innerHTML = `<b>${filtered.length}</b> / ${currentDataset().length} 件を表示中`;
  saveFilterState();
}

function renderActionChips(){
  const box = document.getElementById("actionChips");
  box.innerHTML = VALID_ACTIONS.map(a =>
    `<button class="chipbtn ${actionFilter.has(a)?"on":""}" data-action="${esc(a)}">${esc(a)}</button>`
  ).join("");
  box.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const v = btn.dataset.action;
      if(actionFilter.has(v)) actionFilter.delete(v); else actionFilter.add(v);
      renderActionChips();
      render();
    });
  });
}

function renderConfChips(){
  const box = document.getElementById("confChips");
  box.innerHTML = VALID_CONFIDENCE.map(c =>
    `<button class="chipbtn ${confFilter.has(c)?"on":""}" data-conf="${esc(c)}">確度${esc(c)}</button>`
  ).join("");
  box.querySelectorAll("button").forEach(btn => {
    btn.addEventListener("click", () => {
      const v = btn.dataset.conf;
      if(confFilter.has(v)) confFilter.delete(v); else confFilter.add(v);
      renderConfChips();
      render();
    });
  });
}

function renderDateChips(){
  document.querySelectorAll("#dateChips button").forEach(btn => {
    btn.classList.toggle("on", Number(btn.dataset.date) === dateRangeDays);
  });
}

document.querySelectorAll("#dateChips button").forEach(btn => {
  btn.addEventListener("click", () => { dateRangeDays = Number(btn.dataset.date); renderDateChips(); render(); });
});
document.getElementById("kwInput").addEventListener("input", (e) => { keyword = e.target.value.trim().toLowerCase(); render(); });
document.getElementById("undecidedOnly").addEventListener("change", (e) => { undecidedOnly = e.target.checked; render(); });
document.querySelectorAll("#viewtabs button").forEach(btn => {
  btn.addEventListener("click", () => { currentView = btn.dataset.view; render(); });
});
document.getElementById("resetBtn").addEventListener("click", () => {
  dateRangeDays = 7; actionFilter = new Set(); confFilter = new Set(); keyword = ""; undecidedOnly = false;
  document.getElementById("kwInput").value = "";
  document.getElementById("undecidedOnly").checked = false;
  renderDateChips(); renderActionChips(); renderConfChips();
  render();
});

function filterStorageKey(){ return "lp_filters_v1"; }
function saveFilterState(){
  try{
    localStorage.setItem(filterStorageKey(), JSON.stringify({
      view: currentView, dateRangeDays, action: Array.from(actionFilter),
      conf: Array.from(confFilter), keyword, undecidedOnly,
    }));
  }catch(e){}
}
function loadFilterState(){
  try{
    const raw = localStorage.getItem(filterStorageKey());
    if(!raw) return;
    const s = JSON.parse(raw);
    if(s.view === "proposals" || s.view === "strategy") currentView = s.view;
    if(typeof s.dateRangeDays === "number") dateRangeDays = s.dateRangeDays;
    if(Array.isArray(s.action)) actionFilter = new Set(s.action);
    if(Array.isArray(s.conf)) confFilter = new Set(s.conf);
    if(typeof s.keyword === "string") keyword = s.keyword;
    if(typeof s.undecidedOnly === "boolean") undecidedOnly = s.undecidedOnly;
  }catch(e){}
}

loadFilterState();
document.getElementById("kwInput").value = keyword;
document.getElementById("undecidedOnly").checked = undecidedOnly;
if(!CAN_WRITE){ document.getElementById("gasWarn").hidden = false; }
renderActionChips();
renderConfChips();
renderDateChips();
render();
</script>
</body>
</html>
