  res.innerHTML=(n?'<div style="cursor:default;background:#fafafa">'+n+'件'+(n>300?'（先頭300件表示）':'')+'</div>'+h:'<div style="cursor:default">該当なし</div>');
  res.style.display='block';
 };
 res.onclick=function(e){if(e.target.closest('a.lnk'))return;var d=e.target.closest('div[data-c]');if(d){go(+d.getAttribute('data-c'),+d.getAttribute('data-p'))}};
 render();
})();
